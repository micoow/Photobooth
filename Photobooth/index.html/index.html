<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Photobooth</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
    video, canvas { width: 340px; height: 260px; border-radius: 12px; margin: 10px; }
    #controls { margin-top: 15px; }
    button, select { padding: 10px 18px; margin: 5px; font-size: 16px; cursor: pointer; border-radius: 8px; }
    #gallery img { width: 150px; margin: 8px; border-radius: 8px; border: 2px solid #333; }
  </style>
</head>
<body>
  <h1>📸 Advanced Photobooth</h1>

  <!-- TIMER -->
  <h2 id="timer"></h2>

  <video id="video" autoplay></video>
  <canvas id="canvas"></canvas>

  <!-- CONTROLS -->
  <div id="controls">
    <button id="startBtn">Start Camera</button>
    <button id="captureBtn">Capture</button>

    <!-- FILTERS -->
    <select id="filterSelect">
      <option value="none">No Filter</option>
      <option value="grayscale(100%)">Black & White</option>
      <option value="sepia(100%)">Sepia</option>
      <option value="contrast(180%)">High Contrast</option>
      <option value="blur(3px)">Blur</option>
    </select>

    <!-- LAYOUT -->
    <select id="layoutSelect">
      <option value="single">Single Photo</option>
      <option value="two">2 Vertical Photos</option>
      <option value="four">4 Grid Photos</option>
    </select>
  </div>

  <h2>📁 Gallery</h2>
  <div id="gallery"></div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const timerText = document.getElementById('timer');
    const gallery = document.getElementById('gallery');

    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const filterSelect = document.getElementById('filterSelect');
    const layoutSelect = document.getElementById('layoutSelect');

    startBtn.onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
    };

    function startTimer(seconds) {
      return new Promise(resolve => {
        let count = seconds;
        const interval = setInterval(() => {
          timerText.textContent = count;
          count--;
          if (count < 0) {
            clearInterval(interval);
            timerText.textContent = "";
            resolve();
          }
        }, 1000);
      });
    }

    captureBtn.onclick = async () => {
      await startTimer(3);

      const filter = filterSelect.value;
      ctx.filter = filter;

      const layout = layoutSelect.value;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (layout === 'single') {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
      else if (layout === 'two') {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height / 2);
        ctx.drawImage(video, 0, canvas.height / 2, canvas.width, canvas.height / 2);
      }
      else if (layout === 'four') {
        ctx.drawImage(video, 0, 0, canvas.width / 2, canvas.height / 2);
        ctx.drawImage(video, canvas.width / 2, 0, canvas.width / 2, canvas.height / 2);
        ctx.drawImage(video, 0, canvas.height / 2, canvas.width / 2, canvas.height / 2);
        ctx.drawImage(video, canvas.width / 2, canvas.height / 2, canvas.width / 2, canvas.height / 2);
      }

      const imgURL = canvas.toDataURL('image/png');
      const img = document.createElement('img');
      img.src = imgURL;
      gallery.appendChild(img);
    };
  </script>
</body>
</html>
